apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: 2agents
spec:
  maxRetry: 1
  minAvailable: 1
  schedulerName: volcano
  queue: default
  tasks:
    - replicas: 1
      name: train
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: dkr-creds
          securityContext:
            runAsUser: 1000
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-GeForce-RTX-2080-Ti
          containers:
            - name: runner
              imagePullPolicy: Always
              image: mu00120825.eng.monash.edu.au:5021/keypoint_deformer:latest
              command:
                [
                  "python",
                  "-u",
                  "scripts/train_ae.py",
                  "-c=configs/airplane-8kpt.yaml",
                  "--batch_size=16"
                ]
              workingDir: /app 
              
              env:
                - name: WANDB_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: wandb
                      key: api-key
              resources:
                requests:
                  memory: 24Gi
                  cpu: 9000m
                limits:
                  memory: 32Gi
                  cpu: 10000m
              volumeMounts:
                - name: storage
                  mountPath: /mnt/storage
                - mountPath: /dev/shm
                  name: dshm
          volumes:
            - name: storage
              flexVolume:
                driver: fstab/cifs
                fsType: cifs
                secretRef:
                  name: smb-creds
                options:
                  networkPath: //130.194.128.238/slow
                  mountOptions: dir_mode=0777,file_mode=0777,noperm
            - name: dshm
              emptyDir:
                medium: Memory
