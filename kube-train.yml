apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: lamp2
spec:
  maxRetry: 1
  minAvailable: 1
  schedulerName: volcano
  queue: default
  tasks:
    - replicas: 1
      name: train
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: dkr-creds
          securityContext:
            runAsUser: 1000
          nodeSelector:
            nvidia.com/gpu.product: NVIDIA-RTX-A6000
          containers:
            - name: runner
              imagePullPolicy: Always
              image: mu00120825.eng.monash.edu.au:5021/keypoint_deformer:latest
              command:
                [
                  "python",
                  "scripts/train_ae.py",
                  "--latent_dim=8",
                  "--n_iterations=200000",
                  "-c=configs/airplane-8kpt.yaml",
                ]
                # ["bash",
                # "run.sh",
                # "main.py",
                # "zesty-microwave-291",
                # "8"
                # ]
              workingDir: /app

              env:
                - name: WANDB_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: wandb
                      key: api-key
              resources:
                requests:
                  memory: 24Gi
                  cpu: 6000m
                  nvidia.com/gpu: 1
                limits:
                  nvidia.com/gpu: 1
                  memory: 28Gi
                  cpu: 10000m
              volumeMounts:
                - name: storage
                  mountPath: /mnt/storage
                - name: slow
                  mountPath: /mnt/slow
                - mountPath: /dev/shm
                  name: dshm
          volumes:
            - name: storage
              flexVolume:
                driver: fstab/cifs
                fsType: cifs
                secretRef:
                  name: smb-creds
                options:
                  networkPath: //130.194.128.238/fast
                  mountOptions: dir_mode=0777,file_mode=0777,noperm
            - name: slow
              flexVolume:
                driver: fstab/cifs
                fsType: cifs
                secretRef:
                  name: smb-creds
                options:
                  networkPath: //130.194.128.238/slow
                  mountOptions: dir_mode=0777,file_mode=0777,noperm

            - name: dshm
              emptyDir:
                medium: Memory
